# Build Linux + Windows + Arch packages and attach them to a GitHub Release.
name: Evolve desktop Linux/Windows

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload into (e.g. v4.1.10-build178)'
        required: true
        type: string
      version:
        description: 'Marketing version (e.g. 4.1.10)'
        required: true
        default: '4.1.10'
        type: string
  release:
    types: [published]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev zstd
      - name: Build Linux
        run: |
          flutter config --enable-linux-desktop
          flutter pub get
          flutter build linux --release
          bash scripts/package_linux_release.sh ${{ github.event.inputs.version || '4.1.10' }}
      - name: Upload Linux/Arch to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
        run: |
          VER=${{ github.event.inputs.version || '4.1.10' }}
          gh release upload "$TAG" \
            "build/downloads/v${VER}/evolve-v${VER}-linux-x64.tar.gz" \
            "build/downloads/v${VER}/evolve-v${VER}-linux-x64.tar.gz.sha256" \
            "build/downloads/v${VER}/evolve-v${VER}-archlinux-x86_64.pkg.tar.zst" \
            "build/downloads/v${VER}/evolve-v${VER}-archlinux-x86_64.pkg.tar.zst.sha256" \
            --clobber

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Windows zip
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          flutter build windows --release
          $ver = "${{ github.event.inputs.version || '4.1.10' }}"
          $out = "build/downloads/v$ver"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $zip = Join-Path $out "evolve-v$ver-windows-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath $zip
          Get-FileHash -Algorithm SHA256 $zip | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content -Encoding ascii "$zip.sha256"
          if (Test-Path ./scripts/build_windows_installer.ps1) {
            try { ./scripts/build_windows_installer.ps1 -SkipCodeSign } catch { Write-Host "inno setup optional: $_" }
          }
      - name: Upload Windows to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
        shell: bash
        run: |
          VER=${{ github.event.inputs.version || '4.1.10' }}
          gh release upload "$TAG" \
            "build/downloads/v${VER}/evolve-v${VER}-windows-x64.zip" \
            "build/downloads/v${VER}/evolve-v${VER}-windows-x64.zip.sha256" \
            --clobber
          SETUP=$(ls build/installer/windows/evolve-v*-windows-x64-setup.exe 2>/dev/null | head -1 || true)
          if [[ -n "$SETUP" ]]; then
            gh release upload "$TAG" "$SETUP" --clobber
          fi
